# ==========================================================================
# GustoGlow Spring Boot Configuration Properties
# ==========================================================================

# Database Connection (H2 Embedded SQL File Database)
spring.datasource.url=jdbc:h2:file:./data/gustodb;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console Web Portal Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Server Port (Serve frontend & API endpoints on port 8080)
server.port=8080
